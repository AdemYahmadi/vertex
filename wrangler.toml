# Static deployment of the web app on Cloudflare Workers. Scanning runs in the
# browser (frontend/src/scanner), so there is no server code.
name = "vertex"
compatibility_date = "2025-09-01"

[build]
command = "cd frontend && npm ci && npm run build"

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
